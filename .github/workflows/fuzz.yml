name: fuzz

# A decoder parses untrusted input, so one fuzz run at porting time is not a
# safety story — the corpus has to keep growing against the code as it changes.
# This runs nightly, carries the corpus forward between runs through the cache,
# and fails loudly with the reproducer attached when a target dies.
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds to fuzz each target'
        required: false
        default: '900'

# Never run two sessions at once: they would race on the corpus cache and the
# loser's newly discovered inputs would be dropped.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode, decode_settings]

    steps:
      # The conformance vectors live in the submodule and seed the corpus.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked

      # Rolling key: each run restores the newest corpus and saves a new entry,
      # so coverage accumulates instead of restarting from the seeds every night.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: crates/rav2d/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus from the conformance vectors
        run: crates/rav2d/fuzz/seed-corpus.sh ${{ matrix.target }}

      - name: Fuzz
        working-directory: crates/rav2d/fuzz
        env:
          # Via env, not interpolated into the command line: a workflow_dispatch
          # input is caller-controlled text, and libFuzzer would happily take
          # extra flags smuggled through it.
          DURATION: ${{ github.event.inputs.duration || '900' }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$DURATION" in
            ''|*[!0-9]*) echo "duration must be a whole number of seconds"; exit 1 ;;
          esac
          cargo fuzz run "$TARGET" -- \
            -max_total_time="$DURATION" \
            -rss_limit_mb=4096 \
            -timeout=25 \
            -print_final_stats=1

      # Drop redundant inputs so the cached corpus stays small enough to restore
      # quickly. Runs even after a failure so the cache does not rot.
      - name: Minimize corpus
        if: always()
        working-directory: crates/rav2d/fuzz
        run: cargo fuzz cmin ${{ matrix.target }} || true

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crates/rav2d/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # The reproducer is the whole value of a failed run — keep it even though
      # the job is red.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/rav2d/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
