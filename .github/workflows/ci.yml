name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      DAV2D_LIB_PATH: ${{ github.workspace }}/dav2d/build/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build nasm

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm

      - name: Build dav2d (conformance oracle)
        run: |
          cd dav2d
          meson setup build --default-library=both
          ninja -C build

      - name: cargo fmt --check
        run: cargo fmt --check

      # --all-targets: without it the tests, benches and examples are never
      # linted, and they are where the drift collects.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          DYLD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}
          LD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}

      - name: cargo test (lib)
        run: cargo test -p rav2d --lib -- --test-threads=1
        env:
          DYLD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}
          LD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}

      - name: cargo test (conformance, NEON/native)
        run: cargo test -p rav2d --test conformance
        env:
          DYLD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}
          LD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}

      # On aarch64 the decoder dispatches MC/ipred to the NEON kernels; rerun the
      # conformance corpus with the scalar Rust path forced on so both stay
      # bit-exact. Runs on both aarch64 runners (macOS and Linux).
      - name: cargo test (conformance, scalar fallback)
        if: runner.arch == 'ARM64'
        run: cargo test -p rav2d --test conformance
        env:
          RAV2D_NEON_OFF: all
          DYLD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}
          LD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}

      # Replay every fuzzer-discovered crashing input to guard against
      # regressing a previously-fixed malformed-input panic. Only the fast
      # regression test runs here; the exhaustive random/mutated fuzz sweeps
      # (tests/fuzz.rs) are too slow for CI and run out of band.
      - name: cargo test (fuzz regression corpus)
        run: cargo test -p rav2d --test fuzz fuzz_regression_corpus_no_panic
        env:
          DYLD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}
          LD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}

      - name: cargo build --release
        run: cargo build --release --workspace
        env:
          DYLD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}
          LD_LIBRARY_PATH: ${{ env.DAV2D_LIB_PATH }}

  # The production rav2d crate must package and build standalone — without the
  # dav2d submodule — so it can be published to crates.io. This job removes the
  # submodule before running the publish verification to prove the vendored NEON
  # asm path (crates/rav2d/vendor/dav2d-asm) is self-contained.
  #
  # It runs on every target the vendored asm serves: the test job above always
  # has the submodule, so its own config.h, and never builds the vendored path
  # on aarch64 Linux, which is how issue #7 (Mach-O symbol prefix on ELF)
  # shipped. The CLI build links the asm into a binary, which the library
  # dry-run alone does not do.
  publish-dry-run:
    name: standalone build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish --dry-run (rav2d)
        run: cargo publish -p rav2d --dry-run

      - name: build and run the CLI on the vendored asm
        run: |
          cargo build --release --locked -p rav2d-cli
          ./target/release/rav2d crates/rav2d/tests/data/media/avm-v14.1.0-bus.64x64.l5.obu -o out.y4m
          head -c 64 out.y4m | head -1

  # rust-version in Cargo.toml is a promise to users on older toolchains; check
  # it, since nothing else here builds with anything but the latest stable.
  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4

      - name: Read rust-version
        id: msrv
        run: echo "version=$(awk -F'"' '/^rust-version/ {print $2}' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check
        run: cargo check --locked -p rav2d -p rav2d-cli
