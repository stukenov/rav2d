[package]
name = "rav2d-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line AV2 decoder (IVF or raw OBU to Y4M) built on rav2d"
rust-version.workspace = true
homepage = "https://github.com/stukenov/rav2d"
readme = "README.md"
keywords = ["av2", "video", "decoder", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "rav2d"
path = "src/main.rs"

[dependencies]
rav2d = { workspace = true }
clap = { version = "4", features = ["derive"] }
